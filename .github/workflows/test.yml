name: Tests

# Runs the dev-time test suite (Node's built-in runner, zero dependencies) on
# every push and PR. This does not build or change the shipped app — it just
# loads the real app source into a sandbox and exercises the pure logic.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Full history + origin/main so the release-hygiene guard can diff the
      # branch against main to check that changed assets were cache-busted.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make origin/main available for the release-hygiene diff
        run: git fetch --no-tags origin main:refs/remotes/origin/main || true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run tests
        run: node --test
